# HandoffGraph hosted platform API (Cloudflare Worker skeleton).
#
# Setup (see README.md):
#   npx wrangler d1 create handoffgraph
#     -> replace database_id below with the printed id
#   npx wrangler d1 migrations apply handoffgraph --local
#   npx wrangler dev
#   npx wrangler deploy

name = "handoffgraph-api"
main = "src/index.ts"
compatibility_date = "2026-08-23"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# Public, fixed auth routing values. WorkOS credentials are intentionally not
# checked in: set WORKOS_CLIENT_ID and WORKOS_API_KEY with `wrangler secret
# put` (or in an ignored .dev.vars for local development). Auth fails closed
# with 503 while either credential is absent.
[vars]
APP_ORIGIN = "https://api.handoffgraph.dev"
LANDING_ORIGIN = "https://handoffgraph.dev"
WORKOS_REDIRECT_URI = "https://api.handoffgraph.dev/v1/auth/callback"

# Persist content-free invocation logs and a sampled trace stream. Worker code
# never logs request headers, tokens, bodies, SQL binds, or captured events.
[observability]
enabled = true

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true

[observability.traces]
enabled = true
head_sampling_rate = 0.01

# Custom domain serving (Cloudflare zone required — see ../deploy/README.md).
# Once the handoffgraph.dev zone exists in this account, uncomment to serve
# the API directly on api.handoffgraph.dev:
#
# routes = [
#   { pattern = "api.handoffgraph.dev", custom_domain = true }
# ]

# D1 database: workspace-scoped relational state (see migrations/).
[[d1_databases]]
binding = "DB"
database_name = "handoffgraph"
database_id = "e51cf2d3-d955-4308-8fff-e6405110b1bf"
migrations_dir = "migrations"

# R2 bucket for content-addressed objects. Three prefixes live here:
#   artifacts/<workspace_id>/  compacted JSONL tiers of the event spine
#   exports/<workspace_id>/    user-requested NDJSON extracts
#   (spans.body_ref)           large span bodies, never inlined into D1 rows
# Create it once with: npx wrangler r2 bucket create handoffgraph-bodies
[[r2_buckets]]
binding = "BODIES"
bucket_name = "handoffgraph-bodies"

# Analytics Engine (parity row 39 substrate): recordIngestDataPoints
# (src/analytics.ts) mirrors a sampled, lossy rollup of each accepted ingest
# batch here for AE-native dashboards. Deterministic totals are always read
# from D1 (GET /v1/analytics/series|summary, POST /v1/analytics/funnel) —
# this dataset is never the source of truth and ingest never depends on it
# (fire-and-forget; absence or failure of this binding is a silent no-op).
# No provisioning step: unlike D1/R2/Queues, an Analytics Engine dataset is
# created automatically on first write.
[[analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "handoffgraph_ingest"

# Outbound webhooks (parity row 47): a cron sweep reads new events past each
# workspace's cursor and enqueues one delivery message per (endpoint, event)
# match; the consumer signs and POSTs it to the workspace's endpoint.
#
# Provision once, before first deploy:
#   npx wrangler queues create handoffgraph-webhooks
#   npx wrangler queues create handoffgraph-webhooks-dlq
#
# Endpoint secrets are sealed at rest with WEBHOOK_SEALING_KEY, set the same
# way as the WorkOS credentials above (`wrangler secret put
# WEBHOOK_SEALING_KEY`, or an ignored .dev.vars entry for local development).
# Both webhook registration and delivery fail closed while it is unset.
[[queues.producers]]
binding = "WEBHOOK_QUEUE"
queue = "handoffgraph-webhooks"

[[queues.consumers]]
queue = "handoffgraph-webhooks"
# webhooksQueue (src/webhooks.ts) rethrows the first delivery failure it
# hits in a batch rather than ack()/retry()-ing messages individually, so a
# larger batch would let one bad endpoint force a retry of already-delivered
# batch-mates too. max_batch_size = 1 keeps each retry scoped to exactly the
# one message that actually failed.
max_batch_size = 1
max_batch_timeout = 5
max_retries = 3
dead_letter_queue = "handoffgraph-webhooks-dlq"

# Dashboards-as-config (parity rows 39, 40) needs no new binding today: config
# documents and share-token hashes live in D1 (migration 0008) and the export
# path serves stored canonical bytes verbatim.
#
# The block below is the one optional accelerator, and it is deliberately
# disabled: it would cache share-token -> latest-config resolutions at the edge
# so an unauthenticated GET /v1/shared/dashboards/{token} could skip D1. Enable
# it only after creating the namespace and pasting its real id, and only with
# a short TTL — a cached entry outlives a revocation until it expires, so the
# cache trades revocation latency for read latency.
#
#   npx wrangler kv namespace create DASHBOARD_SHARE_CACHE
#
# [[kv_namespaces]]
# binding = "DASHBOARD_SHARE_CACHE"
# id = "<replace-with-the-id-wrangler-prints>"

# Gateway capture mode (parity rows 6 and 7): an OpenAI-compatible proxy at
# /gateway/openai/v1/* whose real output is a provenance-labelled event per
# proxied call, appended to the same spine as coding-agent evidence.
#
# GATEWAY_KV is the edge cache of the D1 key registry (`vk:<sha256(token)>`)
# plus the per-key rate-limit counters. D1 (migration 0010) stays
# authoritative, so the proxy is fully functional without this binding — it
# just reads D1 on every call and stops enforcing rate limits. Uncomment
# after creating the namespace and pasting the printed id:
#
#   npx wrangler kv namespace create GATEWAY_KV
#
# [[kv_namespaces]]
# binding = "GATEWAY_KV"
# id = "<paste the id printed by `wrangler kv namespace create`>"
#
# Upstream provider credentials are sealed at rest under GATEWAY_SEALING_KEY,
# set the same way as the WorkOS and webhook secrets above (`wrangler secret
# put GATEWAY_SEALING_KEY`, or an ignored .dev.vars entry locally). Both key
# creation and proxying fail closed with 503 while it is unset.
#
# Cached responses (opt-in per request via X-HandoffGraph-Cache) reuse the
# existing BODIES bucket under the gwcache/<workspace_id>/ prefix; no extra
# binding is required.

# Edge-cached API-key verdicts (parity row 44): src/apikeys.ts caches every
# sk_ verification verdict — good or bad — for 60s so a repeated bad key
# never reaches D1 twice in a row and revocation writes an immediate
# tombstone. APIKEY_KV is optional in code (authenticateApiKey falls back to
# always-hit-D1 while it is unset), so the Worker deploys and type-checks
# before this exists. Provision once, then uncomment:
#   npx wrangler kv namespace create handoffgraph-apikeys
#     -> replace id below with the printed id
#
# [[kv_namespaces]]
# binding = "APIKEY_KV"
# id = "REPLACE_WITH_KV_NAMESPACE_ID"

# Agent simulations (parity row 31): a user-simulator + judge loop at
# /v1/simulations, recorded as provenance-labelled events on the spine
# (simulation.turn.completed OBSERVED, simulation.completed INFERRED).
#
# SIM_WORKFLOW is the optional durability accelerator. Each exchange runs in
# step.do('turn-<n>'), so a run killed mid-conversation resumes at the next
# exchange instead of re-billing the completed ones; the deterministic event
# ids make that replay idempotent. The feature is fully functional without it
# — src/simulations.ts falls back to inline bounded execution under a
# wall-clock deadline — so this stays commented until the Workflow exists.
#
# Enabling it is a two-step change, and BOTH steps are required:
#   1. npx wrangler workflows create handoffgraph-simulations   (then uncomment)
#   2. in src/simulations.ts, add
#        import { WorkflowEntrypoint } from "cloudflare:workers";
#      and make the class `extends WorkflowEntrypoint<SimulationsEnv,
#      SimulationRunParams>`. The class already has the constructor/run shape
#      that contract requires; the import is omitted today because the platform
#      test suite runs in plain node (no miniflare) and could not load it.
#
# Instance params carry the caller's upstream credential SEALED under
# GATEWAY_SEALING_KEY (the same secret the gateway uses), because the Workflows
# runtime persists params. With no sealing key set, dispatch deliberately falls
# back to inline execution rather than persisting a raw provider key.
#
# [[workflows]]
# name = "handoffgraph-simulations"
# binding = "SIM_WORKFLOW"
# class_name = "SimulationWorkflow"

# Hosted evals (parity row 29): deterministic evaluators + an optional
# LLM-as-judge at /v1/evals, recorded as provenance-labelled score.recorded
# events on the spine (deterministic checks OBSERVED with source 'evaluation',
# judge verdicts INFERRED with source 'llm_judge'). Cron configs are started by
# the evals sweep in the scheduled dispatcher on the [triggers] cron below.
#
# EVAL_WORKFLOW is the optional durability accelerator. Each trace is evaluated
# in step.do('trace-<id>'), so a run killed mid-evaluation resumes at the next
# trace instead of re-billing the judged ones; the deterministic event ids make
# that replay idempotent (a re-run appends zero duplicate check verdicts). The
# feature is fully functional without it — src/evals.ts falls back to inline
# bounded execution under a wall-clock deadline — so this stays commented until
# the Workflow exists.
#
# Enabling it is a two-step change, and BOTH steps are required:
#   1. npx wrangler workflows create handoffgraph-evals   (then uncomment)
#   2. in src/evals.ts, add
#        import { WorkflowEntrypoint } from "cloudflare:workers";
#      and make the class `extends WorkflowEntrypoint<EvalsEnv, EvalRunParams>`.
#      The class already has the constructor/run shape that contract requires;
#      the import is omitted today because the platform test suite runs in plain
#      node (no miniflare) and could not load it.
#
# Unlike SIM_WORKFLOW, instance params carry NO credential at all — only three
# ids. The judge's BYO provider key lives sealed in the eval_configs row and is
# unsealed from D1 inside the run, so the Workflows runtime (which persists
# params) never holds one.
#
# [[workflows]]
# name = "handoffgraph-evals"
# binding = "EVAL_WORKFLOW"
# class_name = "EvalWorkflow"
#
# Judge credentials are sealed at rest under EVAL_SEALING_KEY, set the same way
# as the WorkOS, webhook and gateway secrets above (`wrangler secret put
# EVAL_SEALING_KEY`, or an ignored .dev.vars entry locally). Creating a judge
# config and starting a judging run BOTH fail closed with 503 while it is
# unset; deterministic-only eval configs never touch it and keep working.

# Prompt playground + prompt CI/CD + optimization loop (parity rows 35, 36, 30)
# at /v1/playground/*, POST /v1/prompts/{name}/labels and
# POST /v1/prompt-optimizer/suggest.
#
# NO NEW BINDING. Deliberately so: the playground reuses the gateway's own
# machinery rather than growing a parallel one —
#   DB                   migration 0014's playground_runs (run METADATA only;
#                        the evidence is playground.completed events on the
#                        spine, which is row 35's acceptance gate);
#   GATEWAY_KV           the same edge cache of the virtual-key registry (the
#                        binding above, still commented until provisioned; D1
#                        stays authoritative, so the routes work without it);
#   GATEWAY_SEALING_KEY  the same `wrangler secret put` value used to unseal a
#                        virtual key's upstream credential. Every route that
#                        calls a model fails closed with 503 while it is unset;
#                        label repoints and listings do not need it and keep
#                        working;
#   BODIES               not used directly. Prompt/completion bodies are stored
#                        ONLY at capture_tier 'full', and then into migration
#                        0010's gateway_capture_bodies table, so redaction keeps
#                        exactly one choke-point.
#
# The GitHub Action that drives the gated label repoint authenticates with an
# `sk_` API key (scope 'write'), so nothing about prompt CI/CD needs a device
# token in a CI secret. See docs/prompt-cicd.md and
# .github/workflows/prompt-ci.yml.example.

# One cron drives every sweep (index.ts scheduled dispatcher): artifact
# compaction + retention (src/artifacts.ts, idempotent, age/size-triggered,
# never touches the events table), the webhook cursor sweep (src/webhooks.ts),
# the scheduled-alert evaluator (src/alerts.ts) and the due-eval starter
# (src/evals.ts). The last two are the only sweeps that write to the spine, and
# only ever by APPENDING (alert.fired / score.recorded). Each sweep is isolated
# in its own try/catch.
[triggers]
crons = ["*/5 * * * *"]

# ---------------------------------------------------------------------------
# Later versions (intentionally commented out — do not enable until shipped).
# ---------------------------------------------------------------------------

# v0.9.x: Queue for burst ingestion — POST /v1/event-batches will enqueue
# instead of writing synchronously once volume requires it.
# [[queues.producers]]
# binding = "INGEST_QUEUE"
# queue = "handoffgraph-ingest"
#
# [[queues.consumers]]
# queue = "handoffgraph-ingest"
# max_batch_size = 100
# max_batch_timeout = 5
# max_retries = 3
# dead_letter_queue = "handoffgraph-ingest-dlq"

# Teams (parity row 45): invite delivery by email. POST /v1/workspace/invites
# already returns the single-use link so an admin can share it out of band; the
# binding below only adds automatic delivery. Enable it after verifying a
# sender address in Cloudflare Email Routing for the zone, then set
# INVITE_SENDER to that address. Nothing in the invite flow depends on it, so
# team onboarding keeps working while this stays commented out.
# [[send_email]]
# name = "INVITE_EMAIL"
# destination_address = "invites@handoffgraph.dev"

# Scheduled alerts (parity row 41): email notification channels. Same
# convention as INVITE_EMAIL above — enable it after verifying a sender address
# in Cloudflare Email Routing for the zone, then add ALERT_SENDER = "<that
# verified address>" to [vars]. Alerting does not depend on it: an alert.fired
# event is still appended to the spine (that IS the alert history, parity row
# 43) and webhook/Slack channels still deliver, so an email channel simply
# fails closed and is logged content-free while this stays commented out.
# [[send_email]]
# name = "ALERT_EMAIL"
# destination_address = "alerts@handoffgraph.dev"

# v0.10.x: Durable Object for live workstream rooms (presence, subscriptions).
# [[durable_objects.bindings]]
# name = "WorkstreamRoom"
# class_name = "WorkstreamRoom"
#
# [[migrations]]
# tag = "v1"
# new_sqlite_classes = ["WorkstreamRoom"]

# Annotation queues (parity row 28): human annotation queues at
# /v1/annotation-queues (src/annotations.ts, migration 0013). D1 stays
# authoritative for queue/item state; ANNOTATION_ROOMS is the optional
# live-view accelerator below.
#
# AnnotationQueueRoom holds an in-memory {pending, claimed, done} snapshot for
# one queue (one room per queue, idFromName(queue_id)); every claim/submit/
# skip/refill best-effort notifies it. GET /v1/annotation-queues/{id}/live
# proxies to it when bound and falls back to a D1 COUNT query (identical
# response shape) when it is not, so the feature is fully functional — just
# slower to reflect the very latest mutation — with no binding at all.
# WebSockets / push-to-viewer are out of scope for this slice; a viewer polls
# the live endpoint. Uncomment both blocks together to enable:
#
# [[durable_objects.bindings]]
# name = "ANNOTATION_ROOMS"
# class_name = "AnnotationQueueRoom"
#
# [[migrations]]
# tag = "v2"
# new_sqlite_classes = ["AnnotationQueueRoom"]
