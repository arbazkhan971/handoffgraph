# HandoffGraph landing page — handoffgraph.dev
# Deploy with: npx wrangler deploy
# Validate without deploying: npx wrangler deploy --dry-run --outdir dist

name = "handoffgraph-landing"
main = "worker.js"
compatibility_date = "2026-08-23"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[observability]
enabled = true

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true

[observability.traces]
enabled = true
head_sampling_rate = 0.01

# Custom domain serving (Cloudflare zone required — see deploy/README.md).
# Once the handoffgraph.dev zone exists in this account, uncomment to serve
# the worker directly on the domain (wrangler creates the DNS records and
# Universal SSL cert automatically):
#
# routes = [
#   { pattern = "handoffgraph.dev", custom_domain = true },
#   { pattern = "www.handoffgraph.dev", custom_domain = true }
# ]

# Inline index.html into the worker bundle as text (no build step).
[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = true

[[rules]]
type = "Data"
globs = ["**/*.png"]
fallthrough = false

# Required before enabling the waitlist in production. Without this binding
# POST /api/waitlist fails closed with 503 so the page uses its
# localStorage/mail fallback; it never acknowledges a discarded submission.
# Each normalized email maps to one pseudonymous `email:<sha256>` key; the
# Worker applies a 90-day TTL to every accepted record.
#
# [[kv_namespaces]]
# binding = "WAITLIST"
# id = "<kv-namespace-id>"
