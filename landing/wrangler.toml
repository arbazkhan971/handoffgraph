# HandoffGraph landing page — handoffgraph.dev
# Deploy with: npx wrangler deploy
# Validate without deploying: npx wrangler deploy --dry-run --outdir dist

name = "handoffgraph-landing"
main = "worker.js"
compatibility_date = "2026-08-23"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false

# Production custom domains. Wrangler creates the Worker-domain DNS records
# and Universal SSL certificates during the controlled cutover.
routes = [
  { pattern = "handoffgraph.dev", custom_domain = true },
  { pattern = "www.handoffgraph.dev", custom_domain = true }
]

[observability]
enabled = true

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true

[observability.traces]
enabled = true
head_sampling_rate = 0.01

# Inline index.html into the worker bundle as text (no build step).
[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = true

[[rules]]
type = "Data"
globs = ["**/*.png"]
fallthrough = false
