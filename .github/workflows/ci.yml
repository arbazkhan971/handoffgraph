name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Validate GitHub release policy
        if: matrix.os == 'ubuntu-latest'
        run: |
          bash .github/scripts/check-action-pins.sh
          bash .github/scripts/validate-release-tag.test.sh
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.25"
      - name: Build
        run: go build ./...
      - name: Build and smoke-test the CLI entrypoint
        shell: bash
        run: |
          go build -trimpath \
            -ldflags "-X github.com/handoffgraph/handoffgraph/internal/buildinfo.version=0.0.0-ci" \
            -o "${RUNNER_TEMP}/handoffgraph" ./cmd/handoffgraph
          test "$("${RUNNER_TEMP}/handoffgraph" version)" = "handoffgraph v0.0.0-ci"
          test "$("${RUNNER_TEMP}/handoffgraph" --help | head -n 1)" = "handoffgraph v0.0.0-ci"
      - name: Vet
        run: go vet ./...
      - name: Format check
        run: test -z "$(gofmt -l .)"
      - name: Module metadata check
        run: go mod tidy -diff
      - name: Test
        run: go test ./...
      - name: Race test
        run: go test -race ./...

  web:
    name: Web UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        working-directory: web
        run: npm ci
      - name: Test
        working-directory: web
        run: npm test
      - name: Lint
        working-directory: web
        run: npm run lint
      - name: Build embedded UI bundle
        working-directory: web
        run: npm run build
      - name: Verify embedded UI bundle is current
        run: git diff --exit-code -- internal/webui/dist

  platform:
    name: Platform and deployment bundles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: platform/package-lock.json
      - name: Install dependencies
        working-directory: platform
        run: npm ci
      - name: Test
        working-directory: platform
        run: npm test
      - name: Typecheck Worker bindings and source
        working-directory: platform
        run: npm run typecheck
      - name: Apply platform D1 migrations locally
        working-directory: platform
        run: >-
          ./node_modules/.bin/wrangler d1 migrations apply handoffgraph --local
          --persist-to "${RUNNER_TEMP}/handoffgraph-d1"
      - name: Dry-run platform Worker bundle
        working-directory: platform
        run: npm run deploy:dry
      - name: Dry-run staging Worker bundle
        working-directory: platform
        run: npm run deploy:dry:staging
      - name: Test landing Worker
        run: node --test landing/*.test.mjs
      - name: Dry-run landing Worker bundle
        working-directory: platform
        run: >-
          ./node_modules/.bin/wrangler deploy --dry-run
          --config ../landing/wrangler.toml
          --outdir "${RUNNER_TEMP}/handoffgraph-landing-dist"

  release-snapshot:
    name: Release snapshot
    needs:
      - test
      - web
      - platform
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.25"
          cache: true
      - name: Build release matrix without publishing
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: "v2.17.1"
          args: release --snapshot --clean
      - name: Verify packaged Linux binary and checksums
        shell: bash
        run: |
          (cd dist && sha256sum --check checksums.txt)
          test "$(find dist -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' \) | wc -l | tr -d ' ')" = 6
          archive="$(find dist -maxdepth 1 -type f -name 'handoffgraph_*_linux_amd64.tar.gz' -print -quit)"
          test -n "${archive}"
          mkdir "${RUNNER_TEMP}/handoffgraph-release-smoke"
          tar -xzf "${archive}" -C "${RUNNER_TEMP}/handoffgraph-release-smoke"
          "${RUNNER_TEMP}/handoffgraph-release-smoke/handoffgraph" version | grep -Eq '^handoffgraph v[^[:space:]]+$'
