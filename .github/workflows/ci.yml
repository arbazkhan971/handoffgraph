name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      # Preserve independent Linux/macOS diagnostics when one platform fails.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Validate GitHub release policy
        if: matrix.os == 'ubuntu-latest'
        run: |
          bash .github/scripts/check-action-pins.sh
          bash .github/scripts/validate-release-tag.test.sh
          bash .github/scripts/verify-release-assets.test.sh
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.25"
      - name: Build
        run: go build ./...
      - name: Build and smoke-test the CLI entrypoint
        shell: bash
        run: |
          go build -trimpath \
            -ldflags "-X github.com/handoffgraph/handoffgraph/internal/buildinfo.version=0.0.0-ci" \
            -o "${RUNNER_TEMP}/handoffgraph" ./cmd/handoffgraph
          test "$("${RUNNER_TEMP}/handoffgraph" version)" = "handoffgraph v0.0.0-ci"
          test "$("${RUNNER_TEMP}/handoffgraph" --help | head -n 1)" = "handoffgraph v0.0.0-ci"
      - name: Vet
        run: go vet ./...
      - name: Format check
        run: test -z "$(gofmt -l .)"
      - name: Module metadata check
        run: go mod tidy -diff
      - name: Test
        run: go test ./...
      - name: Race test
        run: go test -race ./...

  web:
    name: Web UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        working-directory: web
        run: npm ci
      - name: Test
        working-directory: web
        run: npm test
      - name: Lint
        working-directory: web
        run: npm run lint
      - name: Build embedded UI bundle
        working-directory: web
        run: npm run build
      - name: Verify embedded UI bundle is current
        run: git diff --exit-code -- internal/webui/dist

  platform:
    name: Platform and deployment bundles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: platform/package-lock.json
      - name: Install dependencies
        working-directory: platform
        run: npm ci
      - name: Test
        working-directory: platform
        run: npm test
      - name: Typecheck Worker bindings and source
        working-directory: platform
        run: npm run typecheck
      - name: Apply platform D1 migrations locally
        working-directory: platform
        run: >-
          ./node_modules/.bin/wrangler d1 migrations apply handoffgraph --local
          --persist-to "${RUNNER_TEMP}/handoffgraph-d1"
      - name: Dry-run platform Worker bundle
        working-directory: platform
        run: npm run deploy:dry
      - name: Dry-run staging Worker bundle
        working-directory: platform
        run: npm run deploy:dry:staging
      - name: Test landing Worker
        run: node --test landing/*.test.mjs
      - name: Dry-run landing Worker bundle
        working-directory: platform
        run: >-
          ./node_modules/.bin/wrangler deploy --dry-run
          --config ../landing/wrangler.toml
          --outdir "${RUNNER_TEMP}/handoffgraph-landing-dist"

  release-snapshot:
    name: Release snapshot
    needs:
      - test
      - web
      - platform
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.25"
          cache: true
      - name: Build release matrix without publishing
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: "v2.17.1"
          args: release --snapshot --clean
      - name: Verify snapshot release assets
        shell: bash
        run: |
          snapshot_assets="${RUNNER_TEMP}/handoffgraph-snapshot-assets"
          mkdir "${snapshot_assets}"
          cp dist/checksums.txt dist/*.tar.gz dist/*.zip "${snapshot_assets}/"
          snapshot_tag="v$(jq -r '.version' dist/metadata.json)"
          bash .github/scripts/verify-release-assets.sh \
            "${snapshot_tag}" \
            "${snapshot_assets}"
