name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate and build tagged source
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.25"
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            platform/package-lock.json

      - name: Verify immutable workflow action pins
        run: bash .github/scripts/check-action-pins.sh

      - name: Test release tag policy
        run: |
          bash .github/scripts/validate-release-tag.test.sh
          bash .github/scripts/verify-remote-release-tag.test.sh
          bash .github/scripts/verify-public-release.test.sh
          bash .github/scripts/verify-release-assets.test.sh

      - name: Validate canonical repository, SemVer tag, and main HEAD
        shell: bash
        run: |
          git fetch origin main --no-tags
          bash .github/scripts/validate-release-tag.sh \
            "${GITHUB_REPOSITORY}" \
            "${GITHUB_REF_NAME}" \
            "${GITHUB_SHA}" \
            origin/main
          tag_object="$(git rev-parse --verify --end-of-options "refs/tags/${GITHUB_REF_NAME}")"
          bash .github/scripts/verify-remote-release-tag.sh \
            origin \
            "${GITHUB_REF_NAME}" \
            "${GITHUB_SHA}" \
            "${tag_object}"

      - name: Require immutable releases on the canonical repository
        env:
          GH_TOKEN: ${{ secrets.RELEASE_ADMIN_TOKEN }}
        run: >-
          bash .github/scripts/verify-release-assets.sh
          --require-immutable-releases "${GITHUB_REPOSITORY}"

      - name: Require reviewed release notes for this tag
        run: test -s "docs/releases/${GITHUB_REF_NAME}.md"

      - name: Validate and test tagged Go source
        shell: bash
        run: |
          test -z "$(gofmt -l .)"
          go mod tidy -diff
          go vet ./...
          go test ./...
          go test -race ./...

      - name: Test and build the embedded web UI
        working-directory: web
        run: |
          npm ci
          npm test
          npm run lint
          npm run build

      - name: Verify embedded UI bundle is current
        run: git diff --exit-code -- internal/webui/dist

      - name: Test and dry-run the platform Worker
        working-directory: platform
        run: |
          npm ci
          npm test
          npm run typecheck
          ./node_modules/.bin/wrangler d1 migrations apply handoffgraph --local \
            --persist-to "${RUNNER_TEMP}/handoffgraph-d1"
          npm run deploy:dry
          npm run deploy:dry:staging

      - name: Test the landing Worker
        run: node --test landing/*.test.mjs

      - name: Dry-run the landing Worker
        working-directory: platform
        run: >-
          ./node_modules/.bin/wrangler deploy --dry-run
          --config ../landing/wrangler.toml
          --outdir "${RUNNER_TEMP}/handoffgraph-landing-dist"

      - name: Build release matrix without publishing
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: "v2.17.1"
          args: release --snapshot --clean

      - name: Verify snapshot release assets
        shell: bash
        run: |
          snapshot_assets="${RUNNER_TEMP}/handoffgraph-snapshot-assets"
          mkdir "${snapshot_assets}"
          cp dist/checksums.txt dist/*.tar.gz dist/*.zip "${snapshot_assets}/"
          snapshot_tag="v$(jq -r '.version' dist/metadata.json)"
          bash .github/scripts/verify-release-assets.sh \
            "${snapshot_tag}" \
            "${snapshot_assets}"

  publish:
    name: Verify draft and publish immutable release
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Check out the approved tag
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.25"
          cache: true

      - name: Reconfirm approved tag is current main HEAD
        shell: bash
        run: |
          git fetch origin main --no-tags
          bash .github/scripts/validate-release-tag.sh \
            "${GITHUB_REPOSITORY}" \
            "${GITHUB_REF_NAME}" \
            "${GITHUB_SHA}" \
            origin/main
          tag_object="$(git rev-parse --verify --end-of-options "refs/tags/${GITHUB_REF_NAME}")"
          bash .github/scripts/verify-remote-release-tag.sh \
            origin \
            "${GITHUB_REF_NAME}" \
            "${GITHUB_SHA}" \
            "${tag_object}"

      - name: Reconfirm immutable releases before uploading the draft
        env:
          GH_TOKEN: ${{ secrets.RELEASE_ADMIN_TOKEN }}
        run: >-
          bash .github/scripts/verify-release-assets.sh
          --require-immutable-releases "${GITHUB_REPOSITORY}"

      - name: Upload checksummed release draft
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: "v2.17.1"
          args: release --clean --release-notes=docs/releases/${{ github.ref_name }}.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify uploaded draft assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_assets="${RUNNER_TEMP}/handoffgraph-release-assets"
          mkdir "${release_assets}"
          cp dist/checksums.txt dist/*.tar.gz dist/*.zip "${release_assets}/"
          bash .github/scripts/verify-release-assets.sh \
            "${GITHUB_REF_NAME}" \
            "${release_assets}"

          draft_release_id=""
          for attempt in {1..10}; do
            if candidate_release_id="$(bash .github/scripts/verify-release-assets.sh \
              --resolve-github-draft-id \
              "${GITHUB_REPOSITORY}" \
              "${GITHUB_REF_NAME}" 2>/dev/null)"; then
              draft_release_id="${candidate_release_id}"
              break
            fi
            sleep 2
          done
          if [[ -z "${draft_release_id}" ]]; then
            bash .github/scripts/verify-release-assets.sh \
              --resolve-github-draft-id \
              "${GITHUB_REPOSITORY}" \
              "${GITHUB_REF_NAME}" || true
            echo "release draft did not expose one canonical numeric identity" >&2
            exit 1
          fi
          release_id_file="${RUNNER_TEMP}/handoffgraph-release-id"
          (umask 077 && printf '%s\n' "${draft_release_id}" >"${release_id_file}")

          github_assets_ready=false
          for attempt in {1..10}; do
            if bash .github/scripts/verify-release-assets.sh \
              --require-github-release-assets \
              "${GITHUB_REPOSITORY}" \
              "${GITHUB_REF_NAME}" \
              "${release_assets}" \
              draft \
              "${draft_release_id}" 2>/dev/null; then
              github_assets_ready=true
              break
            fi
            sleep 2
          done
          if [[ "${github_assets_ready}" != true ]]; then
            bash .github/scripts/verify-release-assets.sh \
              --require-github-release-assets \
              "${GITHUB_REPOSITORY}" \
              "${GITHUB_REF_NAME}" \
              "${release_assets}" \
              draft \
              "${draft_release_id}" || true
            echo "release draft did not expose the exact canonical asset and digest contract" >&2
            exit 1
          fi

      - name: Prove two clean canonical module installs
        shell: bash
        run: |
          install_root="${RUNNER_TEMP}/handoffgraph-module-install"
          install_bin="${install_root}/bin"
          mkdir -p "${install_bin}"
          expected_version="handoffgraph ${GITHUB_REF_NAME}"
          module="github.com/handoffgraph/handoffgraph/cmd/handoffgraph@${GITHUB_REF_NAME}"
          hashes=()

          for attempt in 1 2; do
            attempt_root="${install_root}/attempt-${attempt}"
            mkdir -p "${attempt_root}/gomodcache" "${attempt_root}/gocache"
            GOBIN="${install_bin}" \
              GOMODCACHE="${attempt_root}/gomodcache" \
              GOCACHE="${attempt_root}/gocache" \
              GOFLAGS=-trimpath \
              GOPROXY=direct \
              go install "${module}"

            test "$("${install_bin}/handoffgraph" version)" = "${expected_version}"
            doctor_output="${attempt_root}/doctor.txt"
            HFG_DATA_DIR="${attempt_root}/data" \
              "${install_bin}/handoffgraph" doctor >"${doctor_output}"
            grep -Fx 'status: OK' "${doctor_output}"
            hashes+=("$(sha256sum "${install_bin}/handoffgraph" | awk '{ print $1 }')")
          done

          test "${hashes[0]}" = "${hashes[1]}"

      - name: Reconfirm tag and immutable-release gate before promotion
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_ADMIN_TOKEN }}
        run: |
          git fetch origin main --no-tags
          bash .github/scripts/validate-release-tag.sh \
            "${GITHUB_REPOSITORY}" \
            "${GITHUB_REF_NAME}" \
            "${GITHUB_SHA}" \
            origin/main
          tag_object="$(git rev-parse --verify --end-of-options "refs/tags/${GITHUB_REF_NAME}")"
          bash .github/scripts/verify-remote-release-tag.sh \
            origin \
            "${GITHUB_REF_NAME}" \
            "${GITHUB_SHA}" \
            "${tag_object}"
          bash .github/scripts/verify-release-assets.sh \
            --require-immutable-releases "${GITHUB_REPOSITORY}"

      - name: Publish and verify immutable release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version_without_build="${GITHUB_REF_NAME%%+*}"
          expected_prerelease=false
          if [[ "${version_without_build}" == *-* ]]; then
            expected_prerelease=true
          fi

          release_assets="${RUNNER_TEMP}/handoffgraph-release-assets"
          release_id_file="${RUNNER_TEMP}/handoffgraph-release-id"
          IFS= read -r draft_release_id <"${release_id_file}"
          bash .github/scripts/verify-release-assets.sh \
            --require-github-release-assets \
            "${GITHUB_REPOSITORY}" \
            "${GITHUB_REF_NAME}" \
            "${release_assets}" \
            draft \
            "${draft_release_id}"

          promotion_payload="$(jq -cn \
            --argjson prerelease "${expected_prerelease}" \
            '{draft: false, prerelease: $prerelease}')"
          promotion_response="$(gh api --method PATCH \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/${GITHUB_REPOSITORY}/releases/${draft_release_id}" \
            --input - <<<"${promotion_payload}")"
          jq -e \
            --argjson release_id "${draft_release_id}" \
            --arg tag "${GITHUB_REF_NAME}" \
            --argjson prerelease "${expected_prerelease}" \
            '.id == $release_id and .tag_name == $tag and .draft == false and .prerelease == $prerelease' \
            >/dev/null <<<"${promotion_response}"

          github_assets_ready=false
          for attempt in {1..15}; do
            if bash .github/scripts/verify-release-assets.sh \
              --require-github-release-assets \
              "${GITHUB_REPOSITORY}" \
              "${GITHUB_REF_NAME}" \
              "${release_assets}" \
              published \
              "${draft_release_id}" 2>/dev/null; then
              github_assets_ready=true
              break
            fi
            sleep 2
          done
          if [[ "${github_assets_ready}" != true ]]; then
            bash .github/scripts/verify-release-assets.sh \
              --require-github-release-assets \
              "${GITHUB_REPOSITORY}" \
              "${GITHUB_REF_NAME}" \
              "${release_assets}" \
              published \
              "${draft_release_id}" || true
            echo "immutable release did not preserve the exact canonical asset and digest contract" >&2
            exit 1
          fi

          public_assets="${RUNNER_TEMP}/handoffgraph-public-release-assets"
          mkdir "${public_assets}"
          gh release download "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --dir "${public_assets}" \
            --pattern checksums.txt \
            --pattern 'handoffgraph_*'
          public_release_ready=false
          for attempt in {1..15}; do
            if bash .github/scripts/verify-public-release.sh \
              "${GITHUB_REPOSITORY}" \
              "${GITHUB_REF_NAME}" \
              "${public_assets}" \
              "${GITHUB_SHA}" 2>/dev/null; then
              public_release_ready=true
              break
            fi
            sleep 2
          done
          if [[ "${public_release_ready}" != true ]]; then
            bash .github/scripts/verify-public-release.sh \
              "${GITHUB_REPOSITORY}" \
              "${GITHUB_REF_NAME}" \
              "${public_assets}" \
              "${GITHUB_SHA}"
            echo "public immutable release attestation/download verification did not complete" >&2
            exit 1
          fi
