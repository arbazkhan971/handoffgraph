name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate and build tagged source
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.25"
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            platform/package-lock.json

      - name: Verify immutable workflow action pins
        run: bash .github/scripts/check-action-pins.sh

      - name: Test release tag policy
        run: bash .github/scripts/validate-release-tag.test.sh

      - name: Validate canonical repository, SemVer tag, and main HEAD
        shell: bash
        run: |
          git fetch origin main --no-tags
          bash .github/scripts/validate-release-tag.sh \
            "${GITHUB_REPOSITORY}" \
            "${GITHUB_REF_NAME}" \
            "${GITHUB_SHA}" \
            origin/main

      - name: Require reviewed release notes for this tag
        run: test -s "docs/releases/${GITHUB_REF_NAME}.md"

      - name: Validate and test tagged Go source
        shell: bash
        run: |
          test -z "$(gofmt -l .)"
          go mod tidy -diff
          go vet ./...
          go test ./...
          go test -race ./...

      - name: Test and build the embedded web UI
        working-directory: web
        run: |
          npm ci
          npm test
          npm run lint
          npm run build

      - name: Verify embedded UI bundle is current
        run: git diff --exit-code -- internal/webui/dist

      - name: Test and dry-run the platform Worker
        working-directory: platform
        run: |
          npm ci
          npm test
          npm run typecheck
          ./node_modules/.bin/wrangler d1 migrations apply handoffgraph --local \
            --persist-to "${RUNNER_TEMP}/handoffgraph-d1"
          npm run deploy:dry
          npm run deploy:dry:staging

      - name: Test the landing Worker
        run: node --test landing/*.test.mjs

      - name: Dry-run the landing Worker
        working-directory: platform
        run: >-
          ./node_modules/.bin/wrangler deploy --dry-run
          --config ../landing/wrangler.toml
          --outdir "${RUNNER_TEMP}/handoffgraph-landing-dist"

      - name: Build release matrix without publishing
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: "v2.17.1"
          args: release --snapshot --clean

      - name: Verify snapshot archives and checksums
        shell: bash
        run: |
          (cd dist && sha256sum --check checksums.txt)
          test "$(find dist -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' \) | wc -l | tr -d ' ')" = 6
          archive="$(find dist -maxdepth 1 -type f -name 'handoffgraph_*_linux_amd64.tar.gz' -print -quit)"
          test -n "${archive}"
          mkdir "${RUNNER_TEMP}/handoffgraph-release-smoke"
          tar -xzf "${archive}" -C "${RUNNER_TEMP}/handoffgraph-release-smoke"
          "${RUNNER_TEMP}/handoffgraph-release-smoke/handoffgraph" version | grep -Eq '^handoffgraph v[^[:space:]]+$'

  publish:
    name: Publish checksummed release archives
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Check out the approved tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.25"
          cache: true

      - name: Reconfirm approved tag is current main HEAD
        shell: bash
        run: |
          git fetch origin main --no-tags
          bash .github/scripts/validate-release-tag.sh \
            "${GITHUB_REPOSITORY}" \
            "${GITHUB_REF_NAME}" \
            "${GITHUB_SHA}" \
            origin/main

      - name: Publish checksummed release archives
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: "v2.17.1"
          args: release --clean --release-notes=docs/releases/${{ github.ref_name }}.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
